{% extends "core/base.html" %}
{% block content %}
    <div class="card">
        <h1>{% if editar %}Editar Post{% else %}Nuevo Post{% endif %}</h1>
        <form method="post" class="post-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if editar %}Guardar cambios{% else %}Publicar{% endif %}</button>
        </form>
    </div>
{% endblock %}
